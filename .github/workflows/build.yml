name: Build

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Add i686 target
        run: rustup target add i686-pc-windows-msvc

      - name: Build and package
        run: ./build.ps1

      - name: Upload ASI artifact
        uses: actions/upload-artifact@v5
        with:
          name: meme_cutscene_skip
          path: out/meme_cutscene_skip.zip

      - name: Upload injector artifact
        uses: actions/upload-artifact@v5
        with:
          name: meme_cutscene_skip_injector
          path: out/meme_cutscene_skip_injector.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/meme_cutscene_skip.zip
            out/meme_cutscene_skip_injector.zip
